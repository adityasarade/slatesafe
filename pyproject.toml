[project]
name = "slatesafe"
version = "0.1.0"
description = "Release-readiness control room for film and episodic delivery teams."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "SlateSafe contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "google-adk>=1.0.0",
  "google-genai>=1.0.0",
  "mcp>=1.0.0",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
